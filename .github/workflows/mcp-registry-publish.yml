name: Publish Docsy MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docsy-official-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish remote MCP server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install checked publisher binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            -o "${RUNNER_TEMP}/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${RUNNER_TEMP}/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/mcp-publisher.tar.gz" -C "${RUNNER_TEMP}" mcp-publisher
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Validate official remote server manifest
        run: mcp-publisher validate server.json
      - name: Authenticate through GitHub Actions OIDC
        run: mcp-publisher login github-oidc
      - name: Publish remote Docsy endpoint to MCP Registry
        run: mcp-publisher publish server.json
